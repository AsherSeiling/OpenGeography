<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout editor options</title>
<!-- Mock-up only: the app bundles Inter and makes no network request. Names and numbers are sample content. Pick an option with ?opt=A, B, C or D. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--surface-0:#E3E8EC;--surface-1:#F2F5F7;--surface-2:#FFFFFF;--rule:#25323B;--rule-soft:#BCC6CE;--text:#121A20;--text-2:#46535D;--accent:#22CCF5;--link:#0562A8;--sel-bg:#6FE0FF;--sel-text:#06222B;--hover:rgba(18,26,32,.08);--desk:#6E7A83;--ok:#1F6B3A;--warn:#8A5A00;--r-control:2px;--r-tab:10px 10px 0 0;--e-float:0 8px 24px rgba(0,0,0,.28);--left:224px;--right:300px}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:400 12px/16px Inter,system-ui,sans-serif;color:var(--text);background:var(--surface-0);overflow:hidden;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}button{background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--text);outline-offset:1px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.app{height:100%;display:flex;flex-direction:column}
.top{flex:none;display:grid;grid-template-columns:var(--left) minmax(0,1fr)}
.qat{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);display:flex;flex-direction:column}
.qat b{flex:1;display:flex;align-items:center;padding:0 12px;font:600 13px/18px Inter,system-ui,sans-serif}
.qr{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule-soft)}
.qr button{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;line-height:14px}.qr svg{font-size:20px}.qr button+button{border-left:1px solid var(--rule-soft)}
.tabs{height:30px;display:flex;align-items:flex-end;position:relative;z-index:1}
.tab{height:30px;padding:0 16px;font:500 13px/18px Inter,system-ui,sans-serif;display:flex;align-items:center;gap:6px}
.tab.on{color:var(--link);font-weight:600;background:var(--surface-2);border:1.5px solid var(--accent);border-bottom:0;border-radius:var(--r-tab);margin-bottom:-1.5px;height:31.5px}
.tab small{font:500 10.5px/13px Inter,system-ui,sans-serif;color:var(--link)}
.sp{flex:1}
.search{width:230px;height:22px;margin:0 8px 4px 0;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--surface-2);border:1px solid var(--rule);border-radius:var(--r-control);color:var(--text-2)}
.band{height:74px;background:var(--surface-2);border:1.5px solid var(--accent);display:flex;padding:2px}
.band.slim{height:38px;align-items:center;gap:2px;padding:0 6px}
.grp{display:flex;flex-direction:column;padding:0 4px;border-right:1px solid var(--rule-soft)}.grp>div:first-child{flex:1;display:flex;gap:1px}
.gl{font:500 10.5px/13px Inter,system-ui,sans-serif;text-align:center;padding-bottom:1px;white-space:nowrap}
.lg{display:flex;flex-direction:column;align-items:center;width:56px;padding-top:3px;gap:2px;font-size:11px;line-height:13px;text-align:center}.lg svg{font-size:24px}
.sm{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 6px 0 4px;font-size:11px;line-height:14px;white-space:nowrap}.sm svg{font-size:14px}
.band.slim .sm{height:26px;padding:0 8px}
.vsep{width:1px;height:20px;background:var(--rule-soft);margin:0 4px}
.rcol{display:flex;flex-direction:column}
.work{flex:1;min-height:0;display:flex}
.col{flex:none;display:flex;flex-direction:column;background:var(--surface-1);min-height:0}
.col.l{width:var(--left);border-right:1px solid var(--rule)}.col.r{width:var(--right);border-left:1px solid var(--rule)}
.ph{flex:none;height:26px;display:flex;align-items:center;padding:0 12px;background:var(--surface-0);border-bottom:1px solid var(--rule-soft);font:500 13px/18px Inter,system-ui,sans-serif}
.pb{flex:1;min-height:0;overflow:auto}
.ph+.pb+.ph{border-top:1px solid var(--rule)}
.it{display:flex;align-items:center;gap:6px;height:24px;padding:0 10px;white-space:nowrap}.it svg{font-size:14px}.it.sel{background:var(--sel-bg);color:var(--sel-text)}.it .e{margin-left:auto;font-size:11px;color:var(--text-2)}.it.d1{padding-left:26px}
.it.sel .e{color:inherit}
.mapcard{margin:8px 10px;border:1px solid var(--rule-soft);background:var(--surface-2);display:grid;grid-template-columns:44px 1fr;gap:8px;padding:6px;align-items:center}.mapcard i{display:block;height:32px;background:#DCE8D2;border:1px solid var(--rule-soft)}.mapcard small{display:block;font-size:11px;line-height:14px;color:var(--text-2)}
.rail{flex:none;width:58px;background:var(--surface-1);border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:stretch;padding:4px 0;gap:1px}
.rail button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;font-size:10.5px;line-height:13px}.rail svg{font-size:20px}.rail button.on{color:var(--link);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--accent)}.rail hr{width:32px;border:0;border-top:1px solid var(--rule-soft);margin:3px auto}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;min-height:0}
.zbar{flex:none;height:28px;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--surface-1);border-bottom:1px solid var(--rule-soft)}
.zbar b{font-weight:600}.zbar small{font-size:11px;color:var(--text-2)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r-control)}.seg span{padding:0 8px;line-height:18px;font-size:11px}.seg span+span{border-left:1px solid var(--rule)}.seg .on{color:var(--link);font-weight:600}
.ruler-h{flex:none;height:18px;background:var(--surface-0);border-bottom:1px solid var(--rule-soft);background-image:repeating-linear-gradient(90deg,var(--rule-soft) 0 1px,transparent 1px 22px);margin-left:18px;font-size:10.5px;line-height:18px;color:var(--text-2);white-space:nowrap;overflow:hidden;word-spacing:190px;padding-left:96px}
.deskrow{flex:1;min-height:0;display:flex}
.ruler-v{flex:none;width:18px;background:var(--surface-0);border-right:1px solid var(--rule-soft);background-image:repeating-linear-gradient(0deg,var(--rule-soft) 0 1px,transparent 1px 22px)}
.desk{flex:1;min-width:0;background:var(--desk);display:grid;place-items:center;position:relative;overflow:hidden}
.page{position:relative;width:calc(var(--u)*279);height:calc(var(--u)*216);background:#fff;color:#111;box-shadow:0 2px 14px rgba(0,0,0,.35)}
.el{position:absolute}.fr{border:1px solid #111;overflow:hidden}.fr svg{width:100%;height:100%;display:block}
.ti{font:600 calc(var(--u)*7.5)/1.15 Inter,system-ui,sans-serif}.st{font-size:calc(var(--u)*3.8);line-height:1.25;color:#333}
.lg2{font-size:calc(var(--u)*3.2);line-height:1.55}.lg2 b{display:block;font-weight:600;font-size:calc(var(--u)*3.6)}.lg2 i{display:inline-block;width:calc(var(--u)*5);height:calc(var(--u)*2.6);border:1px solid #333;margin-right:calc(var(--u)*1.5);vertical-align:-1px}
.sb{font-size:calc(var(--u)*2.8);line-height:1.3}.sb u{display:block;height:calc(var(--u)*1.6);width:calc(var(--u)*48);text-decoration:none;background:linear-gradient(90deg,#111 25%,#fff 25% 50%,#111 50% 75%,#fff 75%);border:1px solid #111}
.na{font:600 calc(var(--u)*6)/1 Inter,system-ui,sans-serif;text-align:center}.src{font-size:calc(var(--u)*2.5);line-height:1.3;color:#444}
.selbox{outline:1.5px solid var(--accent);outline-offset:1px}
.selbox::before,.selbox::after{content:"";position:absolute;width:7px;height:7px;background:#fff;border:1.5px solid var(--link)}
.selbox::before{left:-5px;top:-5px}.selbox::after{right:-5px;bottom:-5px}
.guide{position:absolute;background:#E0339A}.gv{width:1px}.gh{height:1px}
.dim{position:absolute;background:#E0339A;color:#fff;font:600 10.5px/13px Inter,system-ui,sans-serif;padding:0 4px;white-space:nowrap}
.ctx{position:absolute;z-index:3;display:flex;align-items:center;gap:2px;height:32px;padding:0 6px;background:var(--surface-2);color:var(--text);border:1px solid var(--rule);box-shadow:var(--e-float);border-radius:var(--r-control);white-space:nowrap}
.ctx .fv{height:22px;display:inline-flex;align-items:center;gap:6px;padding:0 6px;border:1px solid var(--rule-soft);border-radius:var(--r-control);font-size:11px}.ctx .fv svg{font-size:9px}.ctx .sw{width:18px;height:18px;border:1px solid var(--rule);border-radius:2px;margin:0 2px}
.ctx .ib{width:24px;height:24px;display:grid;place-items:center;font-size:15px}
.itabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-0);border-bottom:1px solid var(--rule-soft)}.itabs button{height:28px;font-size:12px}.itabs .on{color:var(--link);font-weight:600;background:var(--surface-1);box-shadow:inset 0 -2px 0 var(--accent)}
.form{padding:10px 12px;display:grid;gap:8px;align-content:start}.form h4{margin:6px 0 0;font:600 12px/16px Inter,system-ui,sans-serif;border-top:1px solid var(--rule-soft);padding-top:8px}.form h4:first-child{border:0;padding:0;margin:0}
.f{display:grid;grid-template-columns:78px 1fr;gap:6px;align-items:center;color:var(--text-2);font-size:11px;line-height:14px}.fv2{height:22px;padding:0 6px;background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:var(--r-control);display:flex;align-items:center;justify-content:space-between;color:var(--text);font-size:12px;white-space:nowrap;overflow:hidden}.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text)}.chk svg{font-size:14px;color:var(--ok)}.chk.w svg{color:var(--warn)}
.status{flex:none;height:24px;display:flex;align-items:center;gap:12px;padding:0 8px;background:var(--surface-0);border-top:1px solid var(--rule);font-size:11px;line-height:14px}.status a{color:var(--link);font-weight:500}
.pages{flex:none;height:86px;border-top:1px solid var(--rule);background:var(--surface-1);display:flex;align-items:center;gap:10px;padding:0 12px;overflow:hidden}.pg{flex:none;width:82px;height:62px;background:#fff;border:1px solid var(--rule-soft);position:relative}.pg.on{outline:2px solid var(--accent)}.pg i{position:absolute;inset:6px 6px 16px;background:#DCE8D2;border:1px solid #777}.pg small{position:absolute;left:6px;bottom:2px;font-size:10.5px;line-height:13px;color:#333}
.fl{position:absolute;z-index:2;background:var(--surface-1);border:1px solid var(--rule);box-shadow:var(--e-float);border-radius:var(--r-tab);display:flex;flex-direction:column;overflow:hidden}.fl .ph{background:var(--surface-0)}
.studiotop{flex:none;height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--surface-2);border-bottom:1.5px solid var(--accent)}.studiotop b{font-weight:600;font-size:13px}.studiotop .back{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid var(--rule);border-radius:var(--r-control)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:24px;padding:0 10px;border:1.5px solid var(--accent);border-radius:var(--r-control);color:var(--link);font-weight:600;background:var(--surface-2)}
.menu{position:absolute;z-index:4;width:420px;background:var(--surface-1);border:1.5px solid var(--accent);border-radius:var(--r-tab);box-shadow:var(--e-float);overflow:hidden}
.menu header{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border-bottom:1.5px solid var(--accent);background:var(--surface-2)}.menu header svg{font-size:16px}.menu header span{flex:1;height:26px;line-height:24px;padding:0 8px;border:1px solid var(--rule);border-radius:var(--r-control);font-size:14px}
.mr{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:center;padding:4px 10px}.mr svg{font-size:18px}.mr b{display:block;font-weight:600}.mr small{display:block;font-size:11px;line-height:14px;color:var(--text-2)}.mr.on{background:var(--sel-bg);color:var(--sel-text)}.mr.on small{color:inherit}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:min(760px,calc(100% - 48px))}
.gal h2{grid-column:1/-1;margin:0;color:#fff;font:600 16px/22px Inter,system-ui,sans-serif}.gal p{grid-column:1/-1;margin:-10px 0 0;color:#fff;font-size:12px}
.tile{background:var(--surface-2);border:1px solid var(--rule);text-align:left;border-radius:var(--r-tab);overflow:hidden}.tile.on{outline:3px solid var(--accent)}
.thumb{height:118px;background:#F4F5F5;position:relative;border-bottom:1px solid var(--rule-soft)}.thumb i{position:absolute;background:#DCE8D2;border:1px solid #666}.thumb u{position:absolute;background:#333;height:3px;text-decoration:none}
.tile b{display:block;padding:7px 10px 0;font-weight:600}.tile small{display:block;padding:0 10px 8px;font-size:11px;line-height:14px;color:var(--text-2)}
.backmap{flex:1;display:flex;align-items:center;gap:6px;padding:0 12px;font:600 13px/18px Inter,system-ui,sans-serif;color:var(--link);text-align:left}.backmap svg{font-size:16px}
button.it.w{width:100%;text-align:left}.it:hover{background:var(--hover)}.it.sel:hover{background:var(--sel-bg)}
.ctxtab small{margin-right:2px}
.el{cursor:default}
.rail{width:72px;overflow:auto}.rail button{text-align:center;padding:4px 2px}.rail button:hover{background:var(--hover)}.rl{font:500 10.5px/13px Inter,system-ui,sans-serif;color:var(--text-2);text-align:center;padding:3px 2px 1px}.rhead{font:600 12px/16px Inter,system-ui,sans-serif;color:var(--link);text-align:center;padding:2px 0 2px;border-bottom:1.5px solid var(--accent)}
.mb{height:26px;padding:0 10px;font:500 13px/18px Inter,system-ui,sans-serif}.mb:hover{background:var(--hover)}.mb small{font:500 10.5px/13px Inter,system-ui,sans-serif;color:var(--link)}
.lg:hover,.sm:hover{background:var(--hover)}
.pop{position:fixed;z-index:30;min-width:180px;max-height:70vh;overflow:auto;background:var(--surface-2);border:1px solid var(--rule);box-shadow:var(--e-float);padding:4px 0}.pop button{display:block;width:100%;min-height:24px;padding:3px 12px;text-align:left}.pop button:hover,.pop button:focus-visible{background:var(--sel-bg);color:var(--sel-text);outline:0}.pop hr{border:0;border-top:1px solid var(--rule-soft);margin:4px 0}.pt{padding:3px 12px 4px;font:600 10.5px/13px Inter,system-ui,sans-serif;color:var(--text-2);border-bottom:1px solid var(--rule-soft);margin-bottom:3px}
.mm{height:100%;overflow:auto;background:var(--surface-1);padding:20px 24px;display:flex;flex-direction:column;gap:14px}.mm header h1{margin:0;font:600 22px/28px Inter,system-ui,sans-serif}.mm header p{margin:2px 0 0;color:var(--text-2);font-size:13px;line-height:18px}
.mcols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.mc{background:var(--surface-2);border:1px solid var(--rule);border-radius:var(--r-tab);padding:10px 12px}.mc.ctxc{border:1.5px dashed var(--accent)}.mc h3{margin:0;font:600 15px/20px Inter,system-ui,sans-serif;color:var(--link)}.mc>p{margin:0 0 4px;color:var(--text-2);font-size:11px;line-height:14px;min-height:28px}.mc h4{margin:8px 0 2px;font:600 11px/14px Inter,system-ui,sans-serif;border-top:1px solid var(--rule-soft);padding-top:6px}.mc ul{margin:0;padding:0;list-style:none}.mc li{font-size:12px;line-height:18px}.mc em{font-style:normal;font-size:10.5px;color:var(--text-2)}
.mlow{display:grid;grid-template-columns:1fr 1fr;gap:16px}.mlow h3{margin:0 0 6px;font:600 13px/18px Inter,system-ui,sans-serif}.mlow table{border-collapse:collapse;width:100%;background:var(--surface-2)}.mlow th,.mlow td{border:1px solid var(--rule-soft);padding:3px 8px;text-align:left;font-size:12px;line-height:16px}.mlow th{font-weight:600;white-space:nowrap;width:96px}.rules{margin:0;padding-left:16px;line-height:18px}
.qa{display:flex;align-items:center;gap:2px;margin:0 8px 4px 0;height:22px}.qa button{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 6px;font-size:12px;line-height:16px;border-radius:var(--r-control)}.qa button svg{font-size:15px}.qa button:hover:not(:disabled){background:var(--hover)}.qa button:disabled{opacity:.42}
.qat b{flex:1;display:flex;align-items:center}.backmap{flex:1;border-top:1px solid var(--rule-soft)}
</style>
</head>

const allCommands=()=>{const out=[];const walk=g=>g.forEach(([,it])=>it.forEach(c=>{out.push(c.l);(c.menu||[]).forEach(m=>m!=="-"&&out.push(m))}));Object.values(TABS).forEach(t=>walk(t.groups));walk(FRAME_TAB.groups);return out};

/* state */
let tab=opt==="D"?"Insert":opt==="B"?"Page":"Insert",sel=opt==="D"?"page":"legend",iTab=0,pop=null,statusMsg="";
const empty=opt==="D";

const page=(u,extras="")=>{const c=k=>sel===k?"selbox":"";return `<div class="page" data-el="page" style="--u:${u}px">
 <div class="el ti ${c("title")}" data-el="title" style="left:calc(var(--u)*10);top:calc(var(--u)*8)">Stream buffers, Madera County</div>
 <div class="el st" data-el="title" style="left:calc(var(--u)*10);top:calc(var(--u)*17.5)">100 ft geodesic buffer on NHD streams, clipped to the forest boundary</div>
 <div class="el fr ${c("frame")}" data-el="frame" style="left:calc(var(--u)*10);top:calc(var(--u)*25);width:calc(var(--u)*190);height:calc(var(--u)*181)">${mapSvg}</div>
 <div class="el lg2 ${c("legend")}" data-el="legend" style="left:calc(var(--u)*207);top:calc(var(--u)*25);width:calc(var(--u)*62)"><b>Legend</b><div><i style="background:#1F6FB2"></i>Streams (NHD)</div><div><i style="background:#8ee4f7"></i>Stream buffer</div><div><i style="background:#B3532A"></i>Roads</div><div><i style="background:#DCE8D2"></i>Forest boundary</div><div><i style="background:#B59F84"></i>Contours (40 ft)</div></div>
 <div class="el sb ${c("scale")}" data-el="scale" style="left:calc(var(--u)*207);top:calc(var(--u)*90)"><u></u>0 &nbsp; 1 &nbsp; 2 mi · 1:48,000</div>
 <div class="el na ${c("north")}" data-el="north" style="left:calc(var(--u)*207);top:calc(var(--u)*106);width:calc(var(--u)*14)">N<br>↑</div>
 <div class="el src ${c("sources")}" data-el="sources" style="left:calc(var(--u)*207);top:calc(var(--u)*182);width:calc(var(--u)*62)">NAD83 / California zone 4 (ftUS). Sources: USGS NHD; U.S. Census TIGER/Line; USGS 3DEP. Basemap: none.</div>
 ${extras}</div>`};
const qat=`<div class="qat"><b>Madera County</b><button class="backmap">${ic("map")}Back to Map</button></div>`;
const tabNames=()=>opt==="B"?RAIL_TABS:Object.keys(TABS);
const tabsHtml=()=>`<div class="tabs" role="tablist">${tabNames().map(t=>`<button class="tab ${t===tab?"on":""}" role="tab" aria-selected="${t===tab}" data-tab="${t}">${t}</button>`).join("")}${sel==="frame"?`<button class="tab ctxtab ${tab==="Map Frame"?"on":""}" role="tab" data-tab="Map Frame"><small>Selected</small>Map Frame</button>`:""}<span class="sp"></span><div class="qa"><button>${ic("save")}Save</button><button>${ic("undo")}Undo</button><button>${ic("redo")}Redo</button></div><div class="search">${ic("search")}Search commands</div></div>`;
const cmd=c=>`<button class="${c.small?"sm":"lg"}" data-cmd="${esc(c.l)}">${ic(c.i)}<span>${esc(c.l)}${c.menu?" ▾":""}</span></button>`;
const groupsHtml=g=>g.map(([l,it])=>{const sm=it.filter(c=>c.small),lg=it.filter(c=>!c.small);return `<div class="grp"><div>${lg.map(cmd).join("")}${sm.length?`<div class="rcol">${sm.map(cmd).join("")}</div>`:""}</div><div class="gl">${l}</div></div>`}).join("");
const curTab=()=>tab==="Map Frame"?FRAME_TAB:TABS[tab]||TABS[tabNames()[0]];
const bandHtml=()=>`<div class="band">${groupsHtml(curTab().groups)}</div>`;
const itemsHtml=()=>`<div class="ph">Items</div><div class="pb" style="flex:0 0 auto">${empty?`<div class="it" style="color:var(--text-2)">Nothing on the page yet</div>`:`<button class="it w ${sel==="page"?"sel":""}" data-el="page">${ic("page")}Page<span class="e">Letter</span></button>`+ITEMS.map(([k,i,n])=>`<button class="it w ${sel===k?"sel":""}" data-el="${k}">${ic(i)}${n}${k==="frame"?'<span class="e">Overview</span>':""}</button>`+(k==="frame"?["Streams (NHD)","Roads","Forest boundary"].map(l=>`<div class="it d1">${ic("layers")}${l}</div>`).join(""):"")).join("")}</div>`;
const mapsHtml=`<div class="ph" style="border-top:1px solid var(--rule)">Maps</div><div class="pb"><div class="mapcard"><i></i><div><b style="font-weight:600">Overview</b><small>Drag onto the page for a frame.</small></div></div><div class="mapcard"><i style="background:#E6E9EA"></i><div><b style="font-weight:600">Fire access</b><small>Not on this page</small></div></div></div>`;
const inspHtml=()=>{const d=INSP[sel];if(iTab>=d.tabs.length)iTab=0;const[,fields]=d.tabs[iTab];return `<div class="ph">${d.t}</div><div class="itabs" style="grid-template-columns:repeat(${d.tabs.length},1fr)">${d.tabs.map(([t],i)=>`<button class="${i===iTab?"on":""}" data-itab="${i}">${t}</button>`).join("")}</div><div class="pb form">${fields.map(([a,b])=>`<div class="f"><span>${a}</span><div class="fv2">${esc(b)}</div></div>`).join("")}</div>`};
const preflight=`<div class="form" style="padding-top:8px"><div class="chk">${ic("check")}CRS named on the page</div><div class="chk">${ic("check")}Sources listed</div><div class="chk">${ic("check")}Scale bar matches frame</div><div class="chk w">${ic("warn")}Legend lists a hidden layer</div><div class="f"><span>Format</span><div class="fv2">PDF, 300 dpi</div></div><button class="btn">${ic("save")}Export PDF</button></div>`;
const status=()=>`<div class="status"><span>Letter landscape · 279.4 × 215.9 mm</span><span id="msg">${esc(statusMsg)}</span><span class="sp"></span><span>${INSP[sel].t}</span><a>NAD83 / California zone 4 (ftUS)</a></div>`;
const rulers=c=>`<div class="ruler-h">0 50 100 150 200 250</div><div class="deskrow"><div class="ruler-v"></div><div class="desk">${c}</div></div>`;
const zoom=`<div class="zbar"><div class="seg"><span class="on">Fit Page</span><span>100%</span></div><b>78%</b><span class="sp"></span><small>Snap on · Guides on</small></div>`;

function render(){
 let html="";
 if(opt==="A"){
  html=`<div class="top">${qat}<div>${tabsHtml()}${bandHtml()}</div></div><div class="work"><div class="col l">${itemsHtml()}${mapsHtml}</div><div class="stage">${zoom}${rulers(page(2.95))}</div><div class="col r">${inspHtml()}</div></div>${status()}`;
 }else if(opt==="B"){
  const rail=TABS.Insert.groups.map(([l,it],gi)=>`${gi?"<hr>":""}<div class="rl">${l}</div>`+it.map(c=>`<button data-cmd="${esc(c.l)}">${ic(c.i)}${esc(c.l)}${c.menu?" ▾":""}</button>`).join("")).join("");
  html=`<div class="top">${qat}<div>${tabsHtml()}${bandHtml()}</div></div><div class="work"><div class="col l">${itemsHtml()}${mapsHtml}</div><div class="rail" role="toolbar" aria-label="Insert"><div class="rhead">Insert</div>${rail}</div><div class="stage">${zoom}${rulers(page(2.6))}</div><div class="col r">${inspHtml()}</div></div>${status()}`;
 }else if(opt==="C"){
  html=`<div class="studiotop"><button class="back">${ic("map")}Back to Map</button><span class="vsep"></span>${Object.keys(TABS).map(t=>`<button class="mb" data-mb="${t}">${t} ▾</button>`).join("")}${sel==="frame"?`<button class="mb ctxtab" data-mb="Map Frame"><small>Selected</small> Map Frame ▾</button>`:""}<span class="sp"></span><button class="sm">${ic("undo")}Undo</button><button class="sm">${ic("redo")}Redo</button><button class="sm">${ic("save")}Save</button><div class="seg"><span class="on">Fit Page</span><span>100%</span></div></div>
  <div class="work"><div class="stage"><div class="desk">${page(2.82)}<div class="fl" style="left:12px;top:12px;width:208px">${itemsHtml()}</div><div class="fl" style="right:12px;top:12px;width:268px;max-height:330px">${inspHtml()}</div><div class="fl" style="right:12px;bottom:12px;width:268px"><div class="ph">Export</div>${preflight}</div></div></div></div>${status()}`;
 }else if(opt==="D"){
  const tile=(t,d,th,on)=>`<button class="tile ${on?"on":""}"><div class="thumb">${th}</div><b>${t}</b><small>${d}</small></button>`;
  const T=(x,y,w,h)=>`<i style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"></i>`,U=(x,y,w)=>`<u style="left:${x}%;top:${y}%;width:${w}%"></u>`;
  html=`<div class="top">${qat}<div>${tabsHtml()}${bandHtml()}</div></div><div class="work"><div class="col l">${itemsHtml()}${mapsHtml}</div><div class="stage">${zoom}<div class="desk"><div class="gal"><h2>Start this layout</h2><p>Each one uses the Overview map, your layers and your project's sources. Everything stays editable.</p>
  ${tile("Thematic map","Title, map, legend, scale bar, sources",T(6,18,62,74)+U(6,8,50)+U(72,20,20)+U(72,30,16)+U(72,40,18),1)}
  ${tile("Land navigation","Grid, declination, coordinate scales",T(5,6,90,70)+U(10,82,24)+U(40,82,24)+U(70,82,20))}
  ${tile("USGS quadrangle","1:24,000 collar, adjoining quads",T(10,8,80,72)+U(10,86,30)+U(50,86,40))}
  ${tile("Two maps side by side","Compare Overview and Fire access",T(5,18,43,72)+T(52,18,43,72)+U(5,8,60))}
  ${tile("Map with inset","Main map plus a locator",T(5,6,90,88)+`<i style="left:68%;top:60%;width:24%;height:30%;background:#fff"></i>`)}
  ${tile("Blank page","Start empty; Shift+A adds an element",U(40,50,20))}
  </div></div></div><div class="col r">${inspHtml()}</div></div>${status()}`;
 }else{ /* M: the menu map */
  const col=(name,t,cls="")=>`<section class="mc ${cls}"><h3>${name}</h3><p>${t.q}</p>${t.groups.map(([g,it])=>`<h4>${g}</h4><ul>${it.map(c=>`<li>${esc(c.l)}${c.menu?` <em>${c.menu.filter(m=>m!=="-").length===1?"list":c.menu.filter(m=>m!=="-").length+" choices"}</em>`:""}</li>`).join("")}</ul>`).join("")}</section>`;
  const insp=Object.values(INSP).map(d=>`<tr><th>${d.t}</th><td>${d.tabs.map(([t])=>t).join(" · ")}</td></tr>`).join("");
  html=`<div class="mm"><header><h1>Layout menus, level by level</h1><p>Tab, then group, then command, then at most one dropdown. Each tab answers one question, and every command has one home.</p></header>
  <div class="mcols">${Object.keys(TABS).map(k=>col(k,TABS[k])).join("")}${col("Map Frame",FRAME_TAB,"ctxc")}</div>
  <div class="mlow"><section><h3>Properties, by what is selected</h3><table>${insp}</table></section>
  <section><h3>Right-click, by what is under the pointer</h3><table><tr><th>Empty page</th><td>${CTX.page.filter(x=>x!=="-").join(" · ")}</td></tr><tr><th>Element</th><td>${CTX.element.filter(x=>x!=="-").join(" · ")}</td></tr><tr><th>Map frame</th><td>Set from Map View · Which Map, then the same as Element</td></tr></table>
  <h3 style="margin-top:12px">Rules</h3><ul class="rules"><li>"Insert" and "View" mean the same in the map and the layout.</li><li>Map tabs leave while in a layout; Back to Map is always top left.</li><li>Commands grey out rather than move. Only Map Frame comes and goes.</li></ul></section></div></div>`;
 }
 document.getElementById("app").innerHTML=html;
 bind();
}
function say(m){statusMsg=m;const e=document.getElementById("msg");if(e)e.textContent=m}
function closePop(){pop?.remove();pop=null}
function popup(x,y,items,title){closePop();const p=document.createElement("div");p.className="pop";p.setAttribute("role","menu");p.innerHTML=(title?`<div class="pt">${esc(title)}</div>`:"")+items.map(i=>i==="-"?"<hr>":`<button role="menuitem">${esc(i)}</button>`).join("");document.body.appendChild(p);p.style.left=Math.min(x,innerWidth-p.offsetWidth-6)+"px";p.style.top=Math.min(y,innerHeight-p.offsetHeight-6)+"px";p.querySelectorAll("button").forEach(b=>b.onclick=()=>{say(`${title?title+": ":""}${b.textContent}`);closePop()});pop=p;p.querySelector("button")?.focus()}
function findCmd(l){for(const t of [...Object.values(TABS),FRAME_TAB])for(const[,it]of t.groups)for(const c of it)if(c.l===l)return c}
function bind(){
 const a=document.getElementById("app");
 a.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 a.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>{const c=findCmd(b.dataset.cmd),r=b.getBoundingClientRect();if(c?.menu)popup(r.left,r.bottom+2,c.menu,c.l);else say(c?.l||b.dataset.cmd)});
 a.querySelectorAll("[data-mb]").forEach(b=>b.onclick=()=>{const t=b.dataset.mb==="Map Frame"?FRAME_TAB:TABS[b.dataset.mb],r=b.getBoundingClientRect();const items=t.groups.flatMap(([,it],i)=>[...(i?["-"]:[]),...it.map(c=>c.l+(c.menu?" ▸":""))]);popup(r.left,r.bottom+2,items,b.dataset.mb)});
 a.querySelectorAll("[data-itab]").forEach(b=>b.onclick=()=>{iTab=+b.dataset.itab;render()});
 a.querySelectorAll("[data-el]").forEach(e=>{
  e.addEventListener("click",ev=>{ev.stopPropagation();const k=e.dataset.el;if(k!==sel){sel=k;iTab=0;if(sel!=="frame"&&tab==="Map Frame")tab=tabNames()[0];render()}});
  e.addEventListener("contextmenu",ev=>{ev.preventDefault();ev.stopPropagation();const k=e.dataset.el;sel=k;iTab=0;render();popup(ev.clientX,ev.clientY,k==="page"?CTX.page:k==="frame"?CTX.frame:CTX.element,INSP[k].t)});
 });
}
addEventListener("pointerdown",e=>{if(pop&&!pop.contains(e.target))closePop()},true);
addEventListener("keydown",e=>{if(e.key==="Escape")closePop()});
render();
</script>
</body>
</html>
