[workspace]
resolver = "2"
members = ["src-tauri", "crates/engine", "crates/devserver"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Smaller build cache: line tables only for our code (enough for backtraces), no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
