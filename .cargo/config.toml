# Link against a prebuilt libduckdb (fast builds). On macOS with Homebrew:
#   brew install duckdb
# Elsewhere, download libduckdb for your platform from
# https://github.com/duckdb/duckdb/releases and point these at it,
# or build with `--features engine/bundled` to compile DuckDB from source.
[env]
DUCKDB_LIB_DIR = "/opt/homebrew/lib"
DUCKDB_INCLUDE_DIR = "/opt/homebrew/include"
