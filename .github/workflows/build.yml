name: build

# Builds self-contained installers: GDAL, PROJ data, DuckDB and its spatial
# extension are bundled, so users install nothing else. Every job finishes by
# running the packaged app's `--self-test` (headless engine check).
#
# Verified locally: macOS (scripts/package-macos.sh).
# Not yet verified on CI: the Linux and Windows jobs below — expect to adjust
# library paths on their first runs.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DUCKDB_VERSION: v1.5.6

jobs:
  macos:
    runs-on: macos-14 # Apple Silicon
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      # GDAL 3.12 from conda-forge (Homebrew only offers the newest GDAL, and
      # gdal 0.19 doesn't support 3.13) + DuckDB 1.5.6 to match the crate.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: gdal
          conda-remove-defaults: "true"
      # The "lgpl" SpatiaLite build has no GPL librttopo; libgdal-core has no
      # poppler or libheif/x265 — so the installer stays permissively licensed.
      - run: conda install -y -c conda-forge "libgdal-core=3.12" proj pkg-config "libspatialite=*=lgpl*"
      - run: brew install dylibbundler
      - name: Point the build at conda's GDAL and a prebuilt libduckdb
        run: |
          curl -fsSL -o libduckdb.zip "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/libduckdb-osx-universal.zip"
          mkdir -p "$HOME/duckdb" && unzip -o libduckdb.zip -d "$HOME/duckdb"
          echo "DUCKDB_LIB_DIR=$HOME/duckdb" >> "$GITHUB_ENV"
          echo "DUCKDB_INCLUDE_DIR=$HOME/duckdb" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$CONDA_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          # Test binaries find libgdal/libduckdb through rpaths (macOS drops DYLD_* vars).
          echo "TEST_RUSTFLAGS=-C link-arg=-Wl,-rpath,$CONDA_PREFIX/lib -C link-arg=-Wl,-rpath,$HOME/duckdb" >> "$GITHUB_ENV"
          echo "LIB_SEARCH=$CONDA_PREFIX/lib:$HOME/duckdb" >> "$GITHUB_ENV"
          rm -f .cargo/config.toml
      - run: npm ci
      - id: ui
        run: npm test
      - name: Build WhiteboxTools (hydrology tools; tests and the installer use this copy)
        run: scripts/ci-run.sh "WhiteboxTools build" scripts/build-whitebox.sh
      - id: engine
        run: RUSTFLAGS="$TEST_RUSTFLAGS" scripts/ci-run.sh "Engine tests" cargo test -p engine --release
      - name: Map performance gate
        run: RUSTFLAGS="$TEST_RUSTFLAGS" cargo run --release -p engine --bin bench_tiles -- 300000 2000000
      - id: package
        env: { RELEASE: "1" }
        run: scripts/ci-run.sh "Package" scripts/package-macos.sh
      - name: Self-test the packaged app (no Homebrew paths, empty home)
        id: selftest
        run: |
          scripts/ci-run.sh "Self-test" env -i HOME="$(mktemp -d)" PATH=/usr/bin:/bin \
            "target/release/bundle/macos/GIS Studio.app/Contents/MacOS/gis-studio" --self-test
      - name: Job summary
        if: always()
        env:
          UI: ${{ steps.ui.outcome }}
          ENGINE: ${{ steps.engine.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          SELFTEST: ${{ steps.selftest.outcome }}
        run: scripts/ci-summary.sh "macOS (Apple Silicon)"
      - uses: actions/upload-artifact@v4
        with:
          name: gis-studio-macos
          path: target/release/bundle/*.dmg

  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      # apt only supplies Tauri's system packages (the system WebKitGTK stays the
      # web view); GDAL comes from conda-forge so no GPL-only libraries are linked.
      # The runner image's package index is recent enough; skipping `apt-get update`
      # and caching the downloaded .debs avoids the ~12–35 min WebKitGTK install.
      - name: System packages (Tauri)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libclang-dev pkg-config
          version: 1.0
      - uses: Swatinem/rust-cache@v2
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gdal
          create-args: >-
            libgdal-core=3.12
            proj
            libspatialite=*=lgpl*
          condarc: |
            channels:
              - conda-forge
          init-shell: bash
      - name: Point the build at conda's GDAL and a prebuilt libduckdb
        run: |
          curl -fsSL -o libduckdb.zip "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/libduckdb-linux-amd64.zip"
          mkdir -p "$HOME/duckdb" && unzip -o libduckdb.zip -d "$HOME/duckdb"
          echo "DUCKDB_LIB_DIR=$HOME/duckdb" >> "$GITHUB_ENV"
          echo "DUCKDB_INCLUDE_DIR=$HOME/duckdb" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$CONDA_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "GDAL_DATA_SRC=$CONDA_PREFIX/share/gdal" >> "$GITHUB_ENV"
          echo "PROJ_DATA_SRC=$CONDA_PREFIX/share/proj" >> "$GITHUB_ENV"
          # conda's libraries are found through rpaths on our binaries only —
          # never LD_LIBRARY_PATH, which would shadow the system libraries that
          # WebKitGTK links against (libstdc++, libcurl, libxml2, glib, ...).
          echo "LINK_RUSTFLAGS=-C link-arg=-Wl,-rpath,$CONDA_PREFIX/lib -C link-arg=-Wl,-rpath,$HOME/duckdb" >> "$GITHUB_ENV"
          rm -f .cargo/config.toml
      - run: npm ci
      - id: ui
        run: npm test
      - name: Build WhiteboxTools (hydrology tools; tests and the installer use this copy)
        run: scripts/ci-run.sh "WhiteboxTools build" scripts/build-whitebox.sh
      - id: engine
        run: RUSTFLAGS="$LINK_RUSTFLAGS" scripts/ci-run.sh "Engine tests" cargo test -p engine --release
      - run: scripts/stage-resources.sh linux_amd64
      # The AppImage bundler copies every linked shared library (GDAL, PROJ,
      # GEOS, libduckdb, ...) into the image; it finds conda's through the rpath.
      - id: package
        # Don't strip: stripping corrupts the DuckDB extension's trailing metadata.
        env: { NO_STRIP: "true" }
        run: RUSTFLAGS="$LINK_RUSTFLAGS" scripts/ci-run.sh "Package" npx tauri build --bundles appimage,deb
      # Keep conda's GDAL stack in its own folder inside the image so its libraries
      # can't overwrite (or be overwritten by) the system ones WebKitGTK uses.
      - name: Make the conda libraries private inside the AppImage
        run: scripts/ci-run.sh "Private libs" scripts/linux-private-libs.sh "$(ls target/release/bundle/appimage/*.AppImage | head -1)" "$CONDA_PREFIX"
      - name: Self-test the AppImage
        id: selftest
        run: |
          APPIMAGE=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          scripts/ci-run.sh "Self-test" env -i HOME="$(mktemp -d)" PATH=/usr/bin:/bin "$APPIMAGE" --appimage-extract-and-run --self-test
      - name: License gate (GPL-free AppImage)
        run: |
          APPIMAGE=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract >/dev/null)
          scripts/license-gate.sh "$RUNNER_TEMP/squashfs-root"
      - name: Job summary
        if: always()
        env:
          UI: ${{ steps.ui.outcome }}
          ENGINE: ${{ steps.engine.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          SELFTEST: ${{ steps.selftest.outcome }}
        run: scripts/ci-summary.sh "Linux x64"
      - uses: actions/upload-artifact@v4
        with:
          name: gis-studio-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      # GDAL + PROJ from conda-forge (headers, import libs and DLLs).
      # GDAL 3.12 + PROJ from conda-forge via micromamba (setup-miniconda's
      # installer failed on Windows runners).
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gdal
          create-args: >-
            libgdal-core=3.12
            proj
            libspatialite=*=lgpl*
          condarc: |
            channels:
              - conda-forge
          init-shell: bash
      - name: Point the build at conda's GDAL and a prebuilt libduckdb
        run: |
          LIB="$CONDA_PREFIX/Library"
          # gdal-sys looks for the MSVC import library under the name gdal_i.lib.
          cp "$LIB/lib/gdal.lib" "$LIB/lib/gdal_i.lib"
          echo "GDAL_HOME=$LIB" >> "$GITHUB_ENV"
          echo "GDAL_LIB_DIR=$LIB/lib" >> "$GITHUB_ENV"
          echo "GDAL_INCLUDE_DIR=$LIB/include" >> "$GITHUB_ENV"
          echo "GDAL_VERSION=3.12.0" >> "$GITHUB_ENV"
          curl -fsSL -o libduckdb.zip "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/libduckdb-windows-amd64.zip"
          mkdir -p duckdb && unzip -o libduckdb.zip -d duckdb
          echo "DUCKDB_LIB_DIR=$PWD/duckdb" >> "$GITHUB_ENV"
          echo "DUCKDB_INCLUDE_DIR=$PWD/duckdb" >> "$GITHUB_ENV"
          echo "$LIB/bin" >> "$GITHUB_PATH"
          echo "$PWD/duckdb" >> "$GITHUB_PATH"
          rm -f .cargo/config.toml
      - run: npm ci
      - id: ui
        run: npm test
      - name: Build WhiteboxTools (hydrology tools; tests and the installer use this copy)
        run: scripts/ci-run.sh "WhiteboxTools build" scripts/build-whitebox.sh
      - id: engine
        run: scripts/ci-run.sh "Engine tests" cargo test -p engine --release
      - name: Stage resources and the DLLs the app needs next to its exe
        run: |
          GDAL_DATA_SRC="$CONDA_PREFIX/Library/share/gdal" PROJ_DATA_SRC="$CONDA_PREFIX/Library/share/proj" \
            scripts/stage-resources.sh windows_amd64
          mkdir -p src-tauri/dlls
          cp "$CONDA_PREFIX"/Library/bin/*.dll src-tauri/dlls/
          cp duckdb/duckdb.dll src-tauri/dlls/
          scripts/license-gate.sh src-tauri/dlls
          python - <<'PY'
          import json
          p = "src-tauri/tauri.conf.json"
          c = json.load(open(p))
          # Install the DLLs beside gis-studio.exe so Windows finds them.
          c["bundle"]["resources"] = {"resources/**/*": "resources/", "dlls/*.dll": "./"}
          json.dump(c, open(p, "w"), indent=2)
          PY
      - id: package
        run: scripts/ci-run.sh "Package" npx tauri build --bundles nsis,msi
      - name: Self-test the built app
        id: selftest
        run: scripts/ci-run.sh "Self-test" ./target/release/gis-studio.exe --self-test
      - name: Job summary
        if: always()
        env:
          UI: ${{ steps.ui.outcome }}
          ENGINE: ${{ steps.engine.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          SELFTEST: ${{ steps.selftest.outcome }}
        run: scripts/ci-summary.sh "Windows x64"
      - uses: actions/upload-artifact@v4
        with:
          name: gis-studio-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  # Tag a version (git tag v0.1.0 && git push --tags) to publish the three
  # installers as a GitHub Release. Runs only if every platform job passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          GIS Studio $TAG - free, open-source, node-based desktop GIS.

          | Platform | File |
          |---|---|
          | macOS (Apple Silicon) | \`.dmg\` (not notarized: right-click > Open the first time) |
          | Windows x64 | \`.exe\` (NSIS) or \`.msi\` |
          | Linux x64 | \`.AppImage\` or \`.deb\` |

          macOS and Windows builds pass a strict license gate (no GPL-only libraries).
          The Linux AppImage also passes it in CI. Windows and Linux installers have
          passed the automated self-test but not yet a hands-on check on real machines.
          Third-party licenses: THIRD_PARTY_NOTICES.md (attached). Project license: MIT OR Apache-2.0.
          EOF
          gh release create "$TAG" --title "GIS Studio $TAG" --notes-file notes.md \
            --prerelease \
            $(find dist-release -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \)) \
            THIRD_PARTY_NOTICES.md LICENSE
