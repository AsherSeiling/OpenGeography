[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Compile DuckDB from source instead of linking a prebuilt libduckdb.
bundled = ["duckdb/bundled"]

[dependencies]
duckdb = "1.10506.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lru = "0.16"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
ureq = "2.12"
# bindgen: generate GDAL bindings at build time, so any installed GDAL
# version works (gdal-sys only ships bindings for some versions).
gdal = { version = "0.19", features = ["bindgen"] }
gdal-sys = "0.12"
png = "0.18"

[dev-dependencies]
tempfile = "3"
gdal = "0.19"
