[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Compile DuckDB from source instead of linking a prebuilt libduckdb.
bundled = ["duckdb/bundled"]

[dependencies]
duckdb = "1.10506.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lru = "0.16"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
