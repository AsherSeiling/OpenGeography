[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Compile DuckDB from source instead of linking a prebuilt libduckdb.
bundled = ["duckdb/bundled"]

[dependencies]
duckdb = "1.10506.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
lru = "0.16"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
ureq = "2.12"
# gdal 0.19 supports GDAL ≤ 3.12 (prebuilt bindings). GDAL 3.13 changed the
# API (e.g. GDT_Byte), so builds pin GDAL 3.12 — see docs/CI_LOG.md.
gdal = "0.19"
gdal-sys = "0.12"
png = "0.18"
flate2 = "1"
svg2pdf = "0.13"
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }
geographiclib-rs = "0.2.7"

[dev-dependencies]
tempfile = "3"
gdal = "0.19"
